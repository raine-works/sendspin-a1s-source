# ESP32-A1S Audio Kit (ES8388 variant) Sendspin Audio Source: streams line-in audio to Sendspin servers.
#
# Encrypted with Noise_KKpsk2 transport encryption via https://github.com/raine-works/sendspin-a1s-source.

#
# Pinout is the one shared by every A1S config linked from
# https://community.home-assistant.io/t/esp32-a1s-audio-kit-media-player/522245 (arhills, el-bakkali, Test-subj):
#   I2C  SDA 33, SCL 32 (ES8388 at 0x10)    I2S  MCLK 0, BCLK 27, LRCK 25, DIN 35 (DOUT 26 unused here)
#
# Source only: ESPHome's i2s_audio has no full-duplex mode, and a speaker on this bus would hold the I2S lock
# the microphone needs.

esphome:
  name: a1s-sendspin-source
  friendly_name: A1S Sendspin Source
  min_version: 2026.8.0
  on_boot:
    priority: -100
    then:
      # LINE2 is the 3.5 mm line-in jack; LINE1 is the onboard mics
      - select.set:
          id: adc_input
          option: LINE2
      # The es8388 driver sets the ADC up for voice capture; put it back to plain line-level capture
      - lambda: |-
          // ADCCONTROL4: 16-bit I2S framing. The driver writes 0x0D (left-justified) but i2s_audio reads Philips
          // I2S, which is one bit late: every sample loses its sign bit and L/R swap. ESP-ADF writes 0x0C here.
          id(es8388_dac)->write_byte(0x0C, 0x0C);
          // ADCCONTROL1: +12 dB ADC PGA gain for clean line-in capture (0x44 = +12 dB L/R)
          id(es8388_dac)->write_byte(0x09, 0x44);
          // ADCCONTROL10: ALC off (the driver's voice ALC pumps music)
          id(es8388_dac)->write_byte(0x12, 0x22);
          // ADCCONTROL14: noise gate off (the driver's gate mutes the ADC below -40.5 dBFS)
          id(es8388_dac)->write_byte(0x16, 0x00);

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

psram:

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  ap:

captive_portal:

external_components:
  # To iterate on the component without pushing, use `source: {type: local, path: components}` from a clone
  - source: github://raine-works/sendspin-a1s-source@master
    components: [sendspin]
    refresh: always

i2c:
  sda: GPIO33
  scl: GPIO32
  # Expect 0x10 (ES8388). 0x1A is the AC101 variant, which this config does not support.
  scan: true

audio_dac:
  - platform: es8388
    id: es8388_dac

select:
  - platform: es8388
    es8388_id: es8388_dac
    adc_input_mic:
      id: adc_input
      name: ADC Input

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: a1s_adc
    adc_type: external
    i2s_din_pin: GPIO35
    pdm: false
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true
  source:
    task_stack_in_psram: true
    microphone:
      microphone: a1s_adc
      channels: [0, 1]
    # 40ms chunks cut packet rate in half (25/sec instead of 50/sec), preventing queue congestion
    chunk_duration: 40ms
    # 1000ms (1 second) ring buffer in PSRAM protects against transient Wi-Fi jitter
    capture_buffer: 1000ms
    # codec: opus            # Optional: 128kbps Opus for bandwidth-constrained Wi-Fi
    # opus_bitrate: 128000
    # opus_complexity: 2

text_sensor:
  - platform: template
    name: "Pairing Token"
    id: sendspin_pairing_token
    icon: "mdi:key-variant"
    entity_category: diagnostic
    lambda: |-
      return id(sendspin_hub)->get_pairing_token();
    update_interval: 10s
