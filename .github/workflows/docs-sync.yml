# After master's CI passes, Claude fixes the docs that what's new made wrong, in a pull request. The workflow is
# Raineworks', in raine-works/agents (.github/workflows/docs-sync.yml): this file only calls it, and comes from the raineworks-base
# skill's templates/workflows/docs-sync.yml. Change the workflow there, for every repository at once; here, only its
# inputs (with:). The Base rules check moves the pin when the shared workflows change.
name: Docs sync

on:
  # This repository has no CI, so it follows the Base rules check, which runs on every push to master (Claude's action
  # doesn't take push events).
  workflow_run:
    workflows: [Base rules]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  docs-sync:
    name: Docs sync
    uses: raine-works/agents/.github/workflows/docs-sync.yml@13cd4a4496e5c6e8d0b33621c8610f5c68dab3e4 # raine-works/agents master
    secrets: inherit
    # with:
    #   docs: AGENTS.md, README.md and docs/*.md.
