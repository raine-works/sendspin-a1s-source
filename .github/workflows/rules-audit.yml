# Weekly, and when the rules change, Claude audits master against them and keeps a rules-audit issue open while
# something breaks them. The workflow is Raineworks', in raine-works/agents (.github/workflows/rules-audit.yml): this file only
# calls it, and comes from the raineworks-base skill's templates/workflows/rules-audit.yml. Change the workflow there, for
# every repository at once; here, only its inputs (with:). The Base rules check moves the pin when the shared
# workflows change.
name: Rules audit

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write
  actions: read

jobs:
  rules-audit:
    name: Rules audit
    uses: raine-works/agents/.github/workflows/rules-audit.yml@6c97200b5eba4e2f4928ad5f6f9d94aba1549df1 # raine-works/agents master
    secrets: inherit
    # with:
    #   rules: .raineworks/base.md AGENTS.md
    #   checklist: What else to search the source for, as prose.
